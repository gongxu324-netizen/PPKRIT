<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PP Engagement - GUCCI MILAN FW</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        morandigreen: '#6B8E85',
                        morandipink: '#C08285',
                        morandiblue: '#4A6B82',
                        morandigray: '#8C979E',
                        darkbg: '#12161A',
                        cardbg: '#1D232A',
                        cardborder: '#2A323D'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #12161A; color: #E2E8F0; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 relative pb-24 bg-darkbg">

    <!-- 顶栏与背景音乐控制 -->
    <header class="max-w-6xl mx-auto flex justify-between items-center mb-8 border-b border-cardborder pb-4">
        <div>
            <h1 class="text-2xl font-bold tracking-wider text-[#6B8E85]">PP ENGAGEMENT</h1>
            <p class="text-sm text-[#8C979E]">GUCCI-MILAN FW</p>
        </div>
        <div class="flex items-center gap-3">
            <button id="bgm-btn" onclick="toggleBGM()" class="px-4 py-2 bg-[#1D232A] hover:bg-[#2A323D] text-xs rounded-full border border-[#6B8E85]/50 text-[#E2E8F0] flex items-center gap-2 transition">
                <span>🎵 Play Music</span>
            </button>
            <audio id="bgm" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
        </div>
    </header>

    <main class="max-w-6xl mx-auto space-y-8 pr-0 lg:pr-80">

        <!-- 进度统计区域 -->
        <section class="bg-cardbg p-6 rounded-2xl border border-cardborder flex flex-col md:flex-row justify-between items-center gap-4 shadow-xl">
            <div>
                <h2 class="text-lg font-semibold text-[#E2E8F0]">Posts Reviewed (打卡进度)</h2>
                <p class="text-xs text-[#8C979E] mt-1">完成的任务会自动储存在本地浏览器中</p>
            </div>
            <div class="flex items-center gap-4 w-full md:w-auto">
                <span id="progress-text" class="text-xl font-bold text-[#C08285]">0 / 0</span>
                <button onclick="resetProgress()" class="text-xs bg-[#12161A] hover:bg-[#C08285]/20 px-3 py-2 rounded-lg text-[#8C979E] border border-[#C08285]/40 transition">
                    Reset Progress
                </button>
            </div>
        </section>

        <!-- PP KRIT IG 区域 -->
        <section>
            <h3 class="text-sm font-bold text-[#8C979E] uppercase tracking-wider mb-4 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-[#6B8E85]"></span> PP KRIT IG
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="brand-posts"></div>
        </section>

        <!-- Media & KOL 区域 -->
        <section>
            <h3 class="text-sm font-bold text-[#8C979E] uppercase tracking-wider mb-4 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-[#C08285]"></span> Media & KOL (Instagram)
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="media-posts"></div>
        </section>

    </main>

    <!-- 右上角固定展示的文案模块 (Captions Box) -->
    <aside id="caption-widget" class="fixed top-6 right-6 w-80 bg-cardbg/95 backdrop-blur-md border border-[#6B8E85]/30 rounded-2xl p-4 shadow-2xl z-50 transition-all">
        <div class="flex justify-between items-center mb-3">
            <div class="flex items-center gap-1.5 text-xs font-bold text-[#E2E8F0]">
                <span class="text-[#C08285]">🪄</span> GUCCI Milan FW Captions
            </div>
            <button onclick="toggleCaptionWidget()" class="text-[#8C979E] hover:text-white text-xs px-1">✕</button>
        </div>

        <!-- 平台选项Tab -->
        <div class="flex gap-1 mb-3 bg-[#12161A] p-1 rounded-xl border border-cardborder">
            <button id="tab-ig" onclick="switchPlatform('IG')" class="flex-1 py-1.5 text-xs bg-[#6B8E85] font-bold rounded-lg text-white transition">IG</button>
            <button id="tab-x" onclick="switchPlatform('X')" class="flex-1 py-1.5 text-xs text-[#8C979E] font-bold rounded-lg hover:text-white transition">X</button>
        </div>

        <!-- With Hashtag 开关 -->
        <div class="flex justify-between items-center mb-3 text-xs text-[#E2E8F0] bg-[#12161A] p-2.5 rounded-xl border border-cardborder">
            <span class="flex items-center gap-1">🏷️ With Hashtag</span>
            <input type="checkbox" id="hashtag-toggle" checked onchange="updateCaptionDisplay()" class="accent-[#6B8E85] w-4 h-4 cursor-pointer">
        </div>

        <!-- 文案展示框 -->
        <div class="bg-[#12161A] border border-cardborder rounded-xl p-3.5 mb-3 text-xs text-[#E2E8F0] leading-relaxed min-h-[95px] flex items-center justify-center text-left" id="caption-box">
            加载中...
        </div>

        <!-- 底部操作按钮 -->
        <div class="flex gap-2">
            <button onclick="generateRandomCaption()" class="flex-1 bg-[#12161A] hover:bg-[#4A6B82]/30 text-[#E2E8F0] border border-[#4A6B82]/60 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1">
                🔀 Random
            </button>
            <button onclick="copyCaption()" class="flex-1 bg-[#C08285] hover:bg-[#a86e71] text-white py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1 shadow-md">
                📋 Copy
            </button>
        </div>
        
        <div id="toast" class="hidden mt-2 text-center text-xs text-[#6B8E85] font-semibold">
            ✓ Copied to Clipboard!
        </div>
    </aside>

    <!-- 右下角浮动“恢复显示”按钮 -->
    <button id="restore-caption-btn" onclick="toggleCaptionWidget()" class="hidden fixed bottom-6 right-6 bg-[#6B8E85] hover:bg-[#5a7971] text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-xl transition z-40">
        💬 Open Captions
    </button>

    <!-- JS 逻辑 -->
    <script>
        // 1. 帖子数据
        const postsData = {
            brand: [
                { id: "pp1", name: "PP Krit Post 1", link: "https://www.instagram.com/p/DdfnlYIgV7S/?utm_source=ig_web_copy_link&stkn=MzRlODBiNWFlZA==" },
                { id: "pp2", name: "PP Krit Reel 2", link: "https://www.instagram.com/reel/DdbfPrqiyjN/?utm_source=ig_web_copy_link&stkn=MzRlODBiNWFlZA==" }
            ],
            media: [
                { id: "m1", name: "Media Post 1", link: "https://www.instagram.com/p/DdiJR6fk2HM/?utm_source=ig_web_copy_link&stkn=NTc4MTIwNjQ2YQ==" },
                { id: "m2", name: "Media Post 2", link: "https://www.instagram.com/p/DcvuiRbk30l/?utm_source=ig_web_copy_link&stkn=NTc4MTIwNjQ2YQ==" },
                { id: "m3", name: "Media Post 3", link: "https://www.instagram.com/p/Dddazn_zacH/?utm_source=ig_web_copy_link&stkn=NTc4MTIwNjQ2YQ==" },
                { id: "m4", name: "Media Post 4", link: "https://www.instagram.com/p/DdiVUJRGqlR/?utm_source=ig_web_copy_link&stkn=NTc4MTIwNjQ2YQ==" },
                { id: "m5", name: "Media Post 5", link: "https://www.instagram.com/p/Ddbt7K4k1b4/?utm_source=ig_web_copy_link&stkn=NTc4MTIwNjQ2YQ==" }
            ]
        };

        // 2. 指定 Hashtags
        const targetHashtags = "#GUCCIxPPKRIT #Gucci #PPKritt";

        // 3. 随机词库
        const captionTemplates = {
            openings: [
                "Absolute perfection!",
                "The style, the elegance!",
                "So proud of",
                "Can't take my eyes off",
                "Pure luxury and magic!",
                "An absolute masterpiece!",
                "Serving pure visual excellence!"
            ],
            subjects: [
                "PP Krit at GUCCI Milan FW",
                "PP Krit in Milan",
                "PP Krit for GUCCI",
                "PP Krit's incredible look"
            ],
            praises: [
                "is completely stunning! 💖",
                "is purely iconic! 🔥",
                "looks so handsome and classy! ✨",
                "is unmatched in every way! 🌹",
                "shines brighter than ever! 💫"
            ]
        };

        let currentRawText = "";

        // 页面启动执行
        window.onload = function() {
            renderPosts();
            updateProgress();
            generateRandomCaption();
        };

        // 随机文案生成
        function generateRandomCaption() {
            const rand = arr => arr[Math.floor(Math.random() * arr.length)];
            const opening = rand(captionTemplates.openings);
            const subject = rand(captionTemplates.subjects);
            const praise = rand(captionTemplates.praises);

            currentRawText = opening + " " + subject + " " + praise;
            updateCaptionDisplay();
        }

        // 刷新文案框
        function updateCaptionDisplay() {
            const hashtagCheckbox = document.getElementById('hashtag-toggle');
            const withHashtag = hashtagCheckbox ? hashtagCheckbox.checked : true;
            let finalText = currentRawText;

            if (withHashtag) {
                finalText += "\n\n" + targetHashtags;
            }

            const captionBox = document.getElementById('caption-box');
            if (captionBox) {
                captionBox.innerText = finalText;
            }
        }

        // 复制文案
        function copyCaption() {
            const captionBox = document.getElementById('caption-box');
            if (!captionBox) return;
            navigator.clipboard.writeText(captionBox.innerText).then(() => {
                const toast = document.getElementById('toast');
                if (toast) {
                    toast.classList.remove('hidden');
                    setTimeout(() => toast.classList.add('hidden'), 2000);
                }
            });
        }

        // 渲染列表
        function renderPosts() {
            const completed = getCompletedPosts();
            
            const renderList = (data, containerId) => {
                const container = document.getElementById(containerId);
                if (!container) return;
                
                container.innerHTML = data.map(post => {
                    const isDone = completed.includes(post.id);
                    return `
                        <div class="bg-cardbg border ${isDone ? 'border-[#6B8E85] bg-[#6B8E85]/10' : 'border-cardborder'} p-3.5 rounded-xl flex justify-between items-center transition">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-lg ${isDone ? 'bg-[#6B8E85] text-white' : 'bg-[#C08285] text-white'}">
                                ${isDone ? 'DONE ✓' : 'BOOST!'}
                            </span>
                            <span class="text-sm font-medium text-[#E2E8F0] truncate mx-3 flex-1">${post.name}</span>
                            <a href="${post.link}" target="_blank" onclick="markPostDone('${post.id}')" class="text-[#8C979E] hover:text-white p-1">
                                ↗
                            </a>
                        </div>
                    `;
                }).join('');
            };

            renderList(postsData.brand, 'brand-posts');
            renderList(postsData.media, 'media-posts');
        }

        function getCompletedPosts() {
            try {
                return JSON.parse(localStorage.getItem('completed_posts') || '[]');
            } catch (e) {
                return [];
            }
        }

        function markPostDone(postId) {
            let completed = getCompletedPosts();
            if (!completed.includes(postId)) {
                completed.push(postId);
                localStorage.setItem('completed_posts', JSON.stringify(completed));
                setTimeout(() => {
                    renderPosts();
                    updateProgress();
                }, 300);
            }
        }

        function resetProgress() {
            if (confirm("确定要重置打卡进度吗？")) {
                localStorage.removeItem('completed_posts');
                renderPosts();
                updateProgress();
            }
        }

        function updateProgress() {
            const completed = getCompletedPosts();
            const total = postsData.brand.length + postsData.media.length;
            const el = document.getElementById('progress-text');
            if (el) {
                el.innerText = completed.length + " / " + total;
            }
        }

        function toggleCaptionWidget() {
            const widget = document.getElementById('caption-widget');
            const restoreBtn = document.getElementById('restore-caption-btn');
            if (widget && restoreBtn) {
                const isHidden = widget.classList.contains('hidden');
                if (isHidden) {
                    widget.classList.remove('hidden');
                    restoreBtn.classList.add('hidden');
                } else {
                    widget.classList.add('hidden');
                    restoreBtn.classList.remove('hidden');
                }
            }
        }

        function switchPlatform(platform) {
            const tabIG = document.getElementById('tab-ig');
            const tabX = document.getElementById('tab-x');
            if (!tabIG || !tabX) return;
            
            if (platform === 'IG') {
                tabIG.className = "flex-1 py-1.5 text-xs bg-[#6B8E85] font-bold rounded-lg text-white transition";
                tabX.className = "flex-1 py-1.5 text-xs text-[#8C979E] font-bold rounded-lg hover:text-white transition";
            } else {
                tabX.className = "flex-1 py-1.5 text-xs bg-[#6B8E85] font-bold rounded-lg text-white transition";
                tabIG.className = "flex-1 py-1.5 text-xs text-[#8C979E] font-bold rounded-lg hover:text-white transition";
            }
        }

        function toggleBGM() {
            const audio = document.getElementById('bgm');
            const btn = document.getElementById('bgm-btn');
            if (!audio || !btn) return;
            
            if (audio.paused) {
                audio.play();
                btn.innerHTML = '⏸️ Pause Music';
                btn.classList.add('border-[#6B8E85]', 'text-[#6B8E85]');
            } else {
                audio.pause();
                btn.innerHTML = '🎵 Play Music';
                btn.classList.remove('border-[#6B8E85]', 'text-[#6B8E85]');
            }
        }
    </script>
</body>
</html>
